name: Update Flights

on:
  schedule:
    - cron: '0 * * * *' # Runs automatically every hour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch live flight data
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: node fetch-flights.mjs

      - name: Commit and push changes if flights updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add flights.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update live flight data [skip ci]" && git push)
